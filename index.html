<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marc - Présentation</title>
<style>
  /* Couleurs et polices définies une seule fois, faciles à changer */
  :root {
    --couleur-fond: #f4f6f8;
    --couleur-carte: #ffffff;
    --couleur-texte: #2b2b2b;
    --couleur-accent: #2f5d62;
    --couleur-accent-clair: #e4eeee;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: var(--couleur-fond);
    color: var(--couleur-texte);
    line-height: 1.6;
  }

  header {
    background-color: var(--couleur-accent);
    color: #ffffff;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  header h1 {
    margin: 0 0 0.5rem 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2.2rem;
  }

  header p {
    margin: 0;
    font-style: italic;
    font-size: 1.1rem;
  }

  main {
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1.5rem;
  }

  section {
    background-color: var(--couleur-carte);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  h2 {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--couleur-accent);
    margin-top: 0;
  }

  /* Liste des compétences en cartes simples, empilées sur mobile */
  ul.competences {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.8rem;
  }

  ul.competences li {
    background-color: var(--couleur-accent-clair);
    border-left: 4px solid var(--couleur-accent);
    padding: 0.8rem 1rem;
    border-radius: 6px;
    font-weight: bold;
  }

  a.lien-github {
    display: inline-block;
    background-color: var(--couleur-accent);
    color: #ffffff;
    text-decoration: none;
    padding: 0.7rem 1.3rem;
    border-radius: 6px;
    font-weight: bold;
  }

  a.lien-github:hover {
    background-color: #244a4d;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.9rem;
    color: #666666;
  }

  /* Sur écran plus large, les compétences s'affichent côte à côte */
  @media (min-width: 600px) {
    ul.competences {
      grid-template-columns: repeat(3, 1fr);
    }
  }
</style>
</head>
<body>

  <header>
    <h1>Marc</h1>
    <p>F.A.I.L =&gt; First Attempt In Learning</p>
  </header>

  <main>
    <section>
      <h2>Mes compétences et envies</h2>
      <ul class="competences">
        <li>Programmation</li>
        <li>Impression 3D</li>
        <li>Plongée</li>
      </ul>
    </section>

    <section>
      <h2>Me retrouver</h2>
      <p>Si vous souhaitez consulter mes projets, vous pouvez visiter mon profil GitHub.</p>
      <a class="lien-github" href="https://github.com/MDD-Teacher" target="_blank" rel="noopener noreferrer">
        Voir mon GitHub
      </a>
    </section>
  </main>

  <footer>
    <p>Merci de votre visite.</p>
  </footer>

</body>
</html>
